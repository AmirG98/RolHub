name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      # npm install (no npm ci): el lock se genera en macOS y no incluye las
      # deps opcionales de Linux de sharp (@img/sharp-wasm32 → @emnapi/*), asi
      # que npm ci —que es estricto— falla en el runner. npm install las
      # resuelve para la plataforma del runner.
      - run: npm install --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit
      - name: Run tests
        run: npx vitest run
